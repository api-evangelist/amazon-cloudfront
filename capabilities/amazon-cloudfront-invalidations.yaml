naftiko: 1.0.0-alpha2
info:
  label: Amazon CloudFront API — Invalidations
  description: 'Amazon CloudFront API — Invalidations. 2 operations. Lead operation: Amazon CloudFront Create an invalidation.
    Self-contained Naftiko capability covering one Amazon Cloudfront business surface.'
  tags:
  - Amazon Cloudfront
  - Invalidations
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AMAZON_CLOUDFRONT_API_KEY: AMAZON_CLOUDFRONT_API_KEY
capability:
  consumes:
  - type: http
    namespace: amazon-cloudfront-invalidations
    baseUri: https://cloudfront.amazonaws.com
    description: Amazon CloudFront API — Invalidations business capability. Self-contained, no shared references.
    resources:
    - name: 2020-05-31-distribution-DistributionId-invalidation
      path: /2020-05-31/distribution/{DistributionId}/invalidation
      operations:
      - name: createinvalidation
        method: POST
        description: Amazon CloudFront Create an invalidation
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: DistributionId
          in: path
          type: string
          description: The distribution's ID.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: listinvalidations
        method: GET
        description: Amazon CloudFront List invalidations for a distribution
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: DistributionId
          in: path
          type: string
          description: The distribution's ID.
          required: true
        - name: Marker
          in: query
          type: string
          description: Use this parameter when paginating results to indicate where to begin in your list of invalidation
            batches.
        - name: MaxItems
          in: query
          type: integer
          description: The maximum number of invalidation batches to return.
  exposes:
  - type: rest
    namespace: amazon-cloudfront-invalidations-rest
    port: 8080
    description: REST adapter for Amazon CloudFront API — Invalidations. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/2020-05-31/distribution/{distributionid}/invalidation
      name: 2020-05-31-distribution-distributionid-invalidation
      description: REST surface for 2020-05-31-distribution-DistributionId-invalidation.
      operations:
      - method: POST
        name: createinvalidation
        description: Amazon CloudFront Create an invalidation
        call: amazon-cloudfront-invalidations.createinvalidation
        with:
          DistributionId: rest.DistributionId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: listinvalidations
        description: Amazon CloudFront List invalidations for a distribution
        call: amazon-cloudfront-invalidations.listinvalidations
        with:
          DistributionId: rest.DistributionId
          Marker: rest.Marker
          MaxItems: rest.MaxItems
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: amazon-cloudfront-invalidations-mcp
    port: 9090
    transport: http
    description: MCP adapter for Amazon CloudFront API — Invalidations. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: amazon-cloudfront-create-invalidation
      description: Amazon CloudFront Create an invalidation
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: amazon-cloudfront-invalidations.createinvalidation
      with:
        DistributionId: tools.DistributionId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: amazon-cloudfront-list-invalidations-distribution
      description: Amazon CloudFront List invalidations for a distribution
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: amazon-cloudfront-invalidations.listinvalidations
      with:
        DistributionId: tools.DistributionId
        Marker: tools.Marker
        MaxItems: tools.MaxItems
      outputParameters:
      - type: object
        mapping: $.
